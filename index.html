<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbf7ef">
  <meta name="description" content="Abdurashid va Gulnoraning nikoh to‘yiga taklifnoma">
  <title>Abdurashid &amp; Gulnora | Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --ivory: #fbf7ef;
  --cream: #f1e6d4;
  --gold: #bd965c;
  --darkgold: #8f6b3e;
  --text: #594832;
  --white: #fffdf9;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  min-width: 320px;
  overflow-x: hidden;
  color: var(--text);
  font-family: 'Montserrat', sans-serif;
  background:
    radial-gradient(ellipse at 12% 12%, rgba(222,196,151,.28), transparent 32%),
    radial-gradient(ellipse at 88% 78%, rgba(222,196,151,.24), transparent 34%),
    linear-gradient(135deg, #fffdf8, var(--ivory) 48%, #f0e5d4);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .22;
  background-image:
    repeating-linear-gradient(
      45deg,
      transparent 0 42px,
      rgba(174,137,82,.10) 43px,
      transparent 44px
    );
}

/* MAYIN YORUG'LIK */

.glow {
  position: fixed;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(
    circle,
    rgba(255,255,255,.85),
    rgba(229,205,165,.08) 58%,
    transparent 72%
  );
  animation: glowMove 13s ease-in-out infinite alternate;
}

.glow.one {
  left: -150px;
  top: 8%;
}

.glow.two {
  right: -160px;
  bottom: 4%;
  animation-delay: -6s;
}

@keyframes glowMove {
  from {
    transform: translateY(-16px) scale(.9);
    opacity: .45;
  }
  to {
    transform: translateY(22px) scale(1.18);
    opacity: .9;
  }
}

/* OLTIN ZARRALAR */

.particles {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 20;
  pointer-events: none;
}

.particle {
  position: absolute;
  top: -30px;
  color: #c5a16a;
  opacity: 0;
  text-shadow: 0 0 12px rgba(189,150,92,.55);
  animation: falling linear infinite;
}

@keyframes falling {
  0% {
    transform: translateY(-5vh) rotate(0);
    opacity: 0;
  }
  15% {
    opacity: .6;
  }
  85% {
    opacity: .4;
  }
  100% {
    transform: translate(32px,110vh) rotate(300deg);
    opacity: 0;
  }
}

/* GULLAR */

.flower {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  color: rgba(169,129,73,.38);
  font-family: Georgia, serif;
  line-height: 1;
  animation: flowerFloat 7s ease-in-out infinite;
  text-shadow: 0 4px 18px rgba(178,139,83,.12);
}

.flower.f1 {
  top: 26px;
  left: 22px;
  font-size: 68px;
}

.flower.f2 {
  top: 45px;
  right: 25px;
  font-size: 52px;
  animation-delay: -2s;
}

.flower.f3 {
  bottom: 22px;
  left: 8%;
  font-size: 42px;
  animation-delay: -4s;
}

.flower.f4 {
  bottom: 24px;
  right: 8%;
  font-size: 64px;
  animation-delay: -1s;
}

@keyframes flowerFloat {
  0%,100% {
    transform: translateY(0) rotate(-7deg);
  }
  50% {
    transform: translateY(-10px) rotate(7deg);
  }
}

/* BIRINCHI SAHIFA - KONVERT */

.cover {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 22px;
  overflow: hidden;
  background:
    radial-gradient(
      ellipse at 50% 42%,
      rgba(255,255,255,.97),
      rgba(245,235,217,.96) 65%
    ),
    var(--ivory);
  transition: opacity 1.25s ease, visibility 1.25s ease;
}

.cover::before,
.cover::after {
  content: "❀";
  position: absolute;
  color: rgba(177,138,80,.13);
  font-size: clamp(150px, 26vw, 290px);
  pointer-events: none;
}

.cover::before {
  top: -70px;
  left: -55px;
}

.cover::after {
  bottom: -100px;
  right: -60px;
}

.cover.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.cover-card {
  position: relative;
  width: min(100%, 470px);
  min-height: min(720px, 88vh);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 42px 26px;
  text-align: center;
  border: 1px solid rgba(177,138,80,.75);
  outline: 1px solid rgba(177,138,80,.24);
  outline-offset: 8px;
  background: rgba(255,253,248,.62);
  box-shadow: 0 24px 70px rgba(91,66,34,.12);
  animation: cardEnter 1.4s ease both;
}

@keyframes cardEnter {
  from {
    opacity: 0;
    transform: translateY(24px) scale(.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.cover-kicker {
  color: var(--darkgold);
  font-size: 10px;
  letter-spacing: 4px;
  line-height: 1.8;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.cover-names {
  color: var(--darkgold);
  font-family: 'Great Vibes', cursive;
  font-size: clamp(54px, 12vw, 76px);
  line-height: 1.08;
  text-shadow: 0 5px 24px rgba(177,138,80,.16);
}

.ampersand {
  color: #c4a16c;
  font-family: 'Cormorant Garamond', serif;
  font-size: 34px;
  font-style: italic;
  margin: 4px 0;
}

.cover-date {
  margin-top: 18px;
  color: var(--darkgold);
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  letter-spacing: 4px;
}

.ornament {
  margin: 16px 0;
  color: var(--gold);
  font-size: 23px;
  letter-spacing: 8px;
}

/* KONVERT ANIMATSIYASI */

.envelope-stage {
  position: relative;
  width: 190px;
  height: 128px;
  margin: 18px auto 25px;
  perspective: 900px;
  cursor: pointer;
  filter: drop-shadow(0 13px 16px rgba(107,78,39,.17));
  animation: envelopeFloat 3s ease-in-out infinite;
}

@keyframes envelopeFloat {
  0%,100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-9px);
  }
}

.envelope {
  position: absolute;
  inset: 0;
  overflow: visible;
  border-radius: 5px;
  background: linear-gradient(145deg,#f2e3c9,#dfc49a);
  border: 1px solid #c5a16a;
}

.envelope-back {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg,#e8d4b1,#f4e8d4);
  border-radius: 5px;
}

.envelope::before,
.envelope::after {
  content: "";
  position: absolute;
  bottom: 0;
  width: 0;
  height: 0;
  border-style: solid;
  z-index: 3;
}

.envelope::before {
  left: 0;
  border-width: 64px 95px 0 0;
  border-color: transparent #ead7b7 transparent transparent;
}

.envelope::after {
  right: 0;
  border-width: 64px 0 0 95px;
  border-color: transparent transparent transparent #e5d0ac;
}

.envelope-letter {
  position: absolute;
  left: 15px;
  right: 15px;
  bottom: 12px;
  height: 88px;
  z-index: 2;
  display: grid;
  place-items: center;
  color: var(--darkgold);
  background: #fffaf0;
  border: 1px solid rgba(177,138,80,.5);
  font-family: 'Great Vibes', cursive;
  font-size: 26px;
  transition: transform 1s ease .25s;
}

.envelope-flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 95px solid transparent;
  border-right: 95px solid transparent;
  border-top: 72px solid #d4b582;
  transform-origin: top center;
  z-index: 5;
  transition: transform .9s ease, z-index .1s .45s;
}

.envelope-seal {
  position: absolute;
  left: 50%;
  top: 51px;
  z-index: 6;
  width: 35px;
  height: 35px;
  display: grid;
  place-items: center;
  transform: translateX(-50%);
  border-radius: 50%;
  color: #fff8e9;
  background: linear-gradient(145deg,#bd965c,#8f6b3e);
  border: 1px solid rgba(255,255,255,.7);
  font-size: 17px;
  transition: opacity .3s ease;
}

.cover.opening .envelope-flap {
  transform: rotateX(180deg);
  z-index: 1;
}

.cover.opening .envelope-letter {
  transform: translateY(-75px);
}

.cover.opening .envelope-seal {
  opacity: 0;
}

.open-btn {
  border: 1px solid #c4a16c;
  padding: 15px 27px;
  color: #fffdf8;
  background: linear-gradient(135deg,#c7a36d,#927044);
  box-shadow: 0 10px 26px rgba(142,107,60,.2);
  font-size: 10px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: transform .35s ease, box-shadow .35s ease;
}

.open-btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 32px rgba(142,107,60,.3);
}

.open-btn:disabled {
  cursor: default;
}

.cover-hint {
  margin-top: 14px;
  color: #927c5e;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
}

/* ASOSIY TAKLIFNOMA */

.invitation {
  display: none;
  position: relative;
  z-index: 2;
}

.invitation.show {
  display: block;
  animation: pageReveal 1.3s ease both;
}

@keyframes pageReveal {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* TEZKOR NAVIGATSIYA */

.quick-nav {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px 18px;
  padding: 12px 14px;
  background: rgba(251, 247, 239, 0.88);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(177, 138, 80, 0.25);
}

.quick-nav a {
  color: var(--darkgold);
  text-decoration: none;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 5px 8px;
  border-bottom: 1px solid transparent;
  transition: color .25s ease, border-color .25s ease;
}

.quick-nav a:hover {
  color: var(--text);
  border-bottom-color: var(--gold);
}

/* BOSH SAHIFA */

.hero {
  position: relative;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 76px 20px 90px;
  overflow: hidden;
  text-align: center;
  background:
    radial-gradient(ellipse at center, rgba(255,255,255,.78), rgba(249,244,235,.48) 70%),
    linear-gradient(135deg, rgba(239,225,202,.45), rgba(255,253,248,.35));
}

.hero::before,
.hero::after {
  content: "❀";
  position: absolute;
  color: rgba(177,138,80,.13);
  font-size: clamp(160px, 28vw, 300px);
  animation: flowerFloat 9s ease-in-out infinite;
  pointer-events: none;
}

.hero::before {
  left: -70px;
  top: 4%;
}

.hero::after {
  right: -70px;
  bottom: 0;
  animation-delay: -4s;
}

.hero-frame {
  position: relative;
  width: min(100%, 780px);
  padding: 58px 24px;
  border-top: 1px solid rgba(177,138,80,.75);
  border-bottom: 1px solid rgba(177,138,80,.75);
  background: rgba(255,253,248,.3);
  backdrop-filter: blur(3px);
}

.hero-frame::before,
.hero-frame::after {
  content: "✧";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  padding: 0 16px;
  color: var(--gold);
  background: var(--ivory);
  font-size: 25px;
}

.hero-frame::before { top: -15px; }
.hero-frame::after { bottom: -15px; }

/* IKKI TILDAGI IBORA */

.quote {
  max-width: 650px;
  margin: 0 auto 35px;
  color: #806744;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(21px, 4vw, 27px);
  line-height: 1.5;
  animation: quoteAppear 1.6s ease both;
}

.quote-ar {
  display: block;
  margin-bottom: 8px;
  color: #a77d43;
  font-family: 'Amiri', serif;
  font-size: clamp(30px, 6vw, 43px);
  line-height: 1.8;
  direction: rtl;
}

@keyframes quoteAppear {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.eyebrow {
  color: var(--darkgold);
  font-size: 10px;
  letter-spacing: 5px;
  margin-bottom: 28px;
}

.hero h1 {
  color: var(--darkgold);
  font-family: 'Great Vibes', cursive;
  font-size: clamp(78px, 16vw, 132px);
  font-weight: 400;
  line-height: 1.02;
  text-shadow: 0 8px 30px rgba(177,138,80,.14);
  animation: nameRise 1.5s ease both;
}

.hero h1.second {
  animation-delay: .25s;
}

@keyframes nameRise {
  from {
    opacity: 0;
    transform: translateY(35px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero-and {
  margin: 2px 0;
  color: #c4a16c;
  font-family: 'Cormorant Garamond', serif;
  font-size: 44px;
  font-style: italic;
}

.hero-copy {
  max-width: 520px;
  margin: 27px auto 0;
  color: #78664d;
  font-family: 'Cormorant Garamond', serif;
  font-size: 25px;
  line-height: 1.55;
}

.hero-date {
  margin-top: 28px;
  color: var(--darkgold);
  font-family: 'Playfair Display', serif;
  font-size: 25px;
  letter-spacing: 3px;
}

.hero-time {
  margin-top: 12px;
  color: #927c5e;
  font-size: 10px;
  letter-spacing: 4px;
}

.calendar-btn {
  margin-top: 24px;
  display: inline-block;
  padding: 12px 22px;
  border: 1px solid #c4a16c;
  color: #fffdf8;
  background: linear-gradient(135deg, #c7a36d, #927044);
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform .3s ease, box-shadow .3s ease;
}

.calendar-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 22px rgba(142,107,60,.24);
}

/* UMUMIY BO'LIMLAR */

.section {
  position: relative;
  padding: 84px 20px;
  overflow: hidden;
  text-align: center;
}

.section-title {
  color: var(--darkgold);
  font-family: 'Playfair Display', serif;
  font-size: clamp(31px, 6vw, 46px);
  font-weight: 400;
}

.section-copy {
  max-width: 680px;
  margin: 22px auto;
  color: #78664d;
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  line-height: 1.6;
}

.gold-line {
  width: 78px;
  height: 1px;
  margin: 20px auto;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.ornament-line {
  margin: 19px 0;
  color: var(--gold);
  font-size: 24px;
  letter-spacing: 8px;
}

/* SANA SANAGICHI */

.countdown-section {
  position: relative;
  padding: 78px 15px;
  overflow: hidden;
  text-align: center;
  background: linear-gradient(120deg,#efe2cc,#fbf7ef 48%,#efe2cc);
}

.countdown-section::before,
.countdown-section::after {
  content: "✧";
  position: absolute;
  color: rgba(177,138,80,.16);
  font-size: 90px;
}

.countdown-section::before {
  left: 8%;
  top: 12%;
}

.countdown-section::after {
  right: 8%;
  bottom: 12%;
}

.countdown {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 34px;
}

.count-box {
  width: 94px;
  padding: 17px 8px;
  border: 1px solid rgba(177,138,80,.75);
  background: rgba(255,253,248,.7);
  box-shadow: 0 8px 24px rgba(91,66,34,.06);
}

.count-number {
  display: block;
  color: var(--darkgold);
  font-family: 'Playfair Display', serif;
  font-size: 34px;
}

.count-label {
  margin-top: 7px;
  color: #927c5e;
  font-size: 9px;
  letter-spacing: 2px;
}

/* TO'Y DASTURI */

.timeline-section {
  background: rgba(255,253,248,.45);
}

.timeline-list {
  width: min(100%, 640px);
  margin
